<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">PROSE — Process-Semantic History Dynamics for Industrial Prediction</title>
  <desc id="desc">Each variable's history ages in process time instead of clock time: evenly spaced clock ticks are mapped onto process-time ticks that stretch when the operating condition changes.</desc>

  <rect width="1200" height="400" rx="24" fill="#12161C"/>
  <line x1="640" y1="48" x2="640" y2="352" stroke="#2E343D" stroke-width="1.5"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="2" fill="#F0803F">INDUSTRIAL PREDICTION · ANY BACKBONE</text>
    <text x="58" y="196" font-family="Georgia, 'Songti SC', serif" font-size="124" font-weight="700" letter-spacing="2" fill="#E9E6DF">PROSE</text>
    <text x="64" y="246" font-size="27" font-weight="600" fill="#E9E6DF">Process-Semantic History Dynamics</text>
    <text x="64" y="281" font-size="27" font-weight="600" fill="#E9E6DF">for Industrial Prediction</text>
    <text x="64" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9CA2AA">plug-in · Z has the shape of X · no LLM at run time</text>
  </g>

  <g id="process-clock" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <!-- operating condition: steady, then a change at the dashed line -->
    <path d="M700 128 C 740 126, 780 130, 820 127 S 900 129, 920 128 L 920 84 C 960 82, 1000 90, 1040 86 S 1110 84, 1140 88" fill="none" stroke="#4FB3BA" stroke-width="3" stroke-linecap="round"/>
    <text x="700" y="70" font-size="19" fill="#4FB3BA">operating condition</text>
    <line x1="920" y1="60" x2="920" y2="316" stroke="#F0803F" stroke-width="1.5" stroke-dasharray="5 6"/>
    <text x="932" y="70" font-size="18" fill="#F0803F">condition changes</text>

    <!-- clock time: even ticks -->
    <line x1="700" y1="180" x2="1140" y2="180" stroke="#E9E6DF" stroke-width="2"/>
    <g stroke="#E9E6DF" stroke-width="2">
      <line x1="700" y1="172" x2="700" y2="188"/><line x1="755" y1="172" x2="755" y2="188"/><line x1="810" y1="172" x2="810" y2="188"/>
      <line x1="865" y1="172" x2="865" y2="188"/><line x1="920" y1="172" x2="920" y2="188"/><line x1="975" y1="172" x2="975" y2="188"/>
      <line x1="1030" y1="172" x2="1030" y2="188"/><line x1="1085" y1="172" x2="1085" y2="188"/><line x1="1140" y1="172" x2="1140" y2="188"/>
    </g>
    <text x="700" y="164" font-size="19" fill="#E9E6DF">clock time <tspan font-style="italic">t</tspan></text>

    <!-- re-timing: each clock tick lands on a process-time tick -->
    <g stroke="#9CA2AA" stroke-width="1.2" opacity="0.7">
      <line x1="700" y1="190" x2="700" y2="290"/><line x1="755" y1="190" x2="738" y2="290"/><line x1="810" y1="190" x2="776" y2="290"/>
      <line x1="865" y1="190" x2="814" y2="290"/><line x1="920" y1="190" x2="852" y2="290"/><line x1="975" y1="190" x2="924" y2="290"/>
      <line x1="1030" y1="190" x2="996" y2="290"/><line x1="1085" y1="190" x2="1068" y2="290"/><line x1="1140" y1="190" x2="1140" y2="290"/>
    </g>

    <!-- process time: compressed while steady, stretched after the change -->
    <line x1="700" y1="300" x2="1140" y2="300" stroke="#F0803F" stroke-width="2"/>
    <g stroke="#F0803F" stroke-width="2">
      <line x1="700" y1="292" x2="700" y2="308"/><line x1="738" y1="292" x2="738" y2="308"/><line x1="776" y1="292" x2="776" y2="308"/>
      <line x1="814" y1="292" x2="814" y2="308"/><line x1="852" y1="292" x2="852" y2="308"/><line x1="924" y1="292" x2="924" y2="308"/>
      <line x1="996" y1="292" x2="996" y2="308"/><line x1="1068" y1="292" x2="1068" y2="308"/><line x1="1140" y1="292" x2="1140" y2="308"/>
    </g>
    <text x="700" y="336" font-size="19" fill="#F0803F">process time <tspan font-style="italic">Θ</tspan></text>
    <text x="1140" y="336" font-size="18" fill="#9CA2AA" text-anchor="end">history ages faster</text>
  </g>
</svg>
